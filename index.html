<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>TZ PODZ | Catálogo</title>
<style>
:root{--gold:#ffd700;--green:#39ff14;--bg:#050505;--card:#101010;--muted:#a5a5a5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#f7f7f7;font-family:Arial,Helvetica,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 10% 5%,#39ff140b,transparent 40%),radial-gradient(ellipse at 95% 60%,#ffd7000a,transparent 45%)}
header{display:flex;justify-content:space-between;align-items:center;padding:22px max(5%,calc((100% - 1200px)/2));border-bottom:1px solid #292929}
.logo{font-size:29px;font-weight:900;letter-spacing:3px}.logo span{color:var(--gold);text-shadow:0 0 15px #ffd70099}
header small{color:var(--green);letter-spacing:2px;font-size:11px;text-shadow:0 0 12px #39ff1470}
.hero{text-align:center;padding:85px 20px 65px}.eyebrow{color:var(--green);letter-spacing:4px;font-size:12px;text-shadow:0 0 12px var(--green)}
h1{font-size:clamp(38px,7vw,76px);margin:15px 0;letter-spacing:-2px}h1 em{font-style:normal;color:var(--gold);text-shadow:0 0 35px #ffd70055}
.hero p{color:var(--muted);line-height:1.7}main{max-width:1200px;margin:auto;padding:0 20px 70px}
.search{width:100%;max-width:420px;padding:15px 18px;background:#111;border:1px solid #333;border-radius:12px;color:#fff;outline:none;margin-bottom:30px}.search:focus{border-color:var(--green);box-shadow:0 0 15px #39ff1425}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.card{background:var(--card);border:1px solid #292929;border-radius:18px;overflow:hidden;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 0 25px #ffd70022,0 0 45px #39ff140d}
.photo{height:260px;background:radial-gradient(circle,#222 0%,#0a0a0a 70%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain}.placeholder{display:flex;flex-direction:column;align-items:center;gap:12px;color:#666;font-size:12px;letter-spacing:2px}.placeholder b{font-size:75px;font-weight:normal;color:#4b4b4b;text-shadow:0 0 25px #ffd70022}
.info{padding:21px}.info h2{margin:0 0 9px;font-size:22px}.info p{color:var(--muted);font-size:13px;line-height:1.6;min-height:40px}
.price{color:#fff;font-weight:800;font-size:23px;margin:18px 0}.price.unset{font-size:15px;color:#aaa}
button{font:inherit;cursor:pointer}.details{width:100%;background:#0b0b0b;border:1px solid var(--gold);color:var(--gold);padding:13px;border-radius:10px;font-weight:700;transition:.2s}.details:hover{background:#ffd700;color:#050505;box-shadow:0 0 20px #ffd70066}
footer{text-align:center;border-top:1px solid #242424;color:#777;padding:28px;font-size:12px}
.modal{position:fixed;inset:0;background:#000d;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}
.dialog{width:100%;max-width:500px;max-height:92vh;overflow:auto;background:#101010;border:1px solid var(--green);border-radius:20px;padding:24px;box-shadow:0 0 35px #39ff1425}
.close{float:right;background:#222;border:0;color:white;border-radius:9px;padding:9px 13px}.modal-photo{height:250px;display:flex;align-items:center;justify-content:center;clear:both}.modal-photo img{max-width:100%;max-height:100%;object-fit:contain}
.order{display:block;text-align:center;text-decoration:none;padding:15px;border-radius:10px;background:var(--green);color:#050505;font-weight:800;box-shadow:0 0 18px #39ff1440}.order.disabled{pointer-events:none;background:#333;color:#999;box-shadow:none}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo{height:200px}}
@media(max-width:500px){header{padding:18px}.hero{padding:60px 15px 45px}.grid{gap:12px}.photo{height:150px}.info{padding:13px}.info h2{font-size:17px}.info p{font-size:12px}.price{font-size:19px}.details{font-size:12px;padding:12px 5px}}
</style>
</head>
<body>
<header><div class="logo">TZ <span>PODZ</span></div><small>DEMONSTRAÇÃO ESTÁTICA</small></header>
<section class="hero"><div class="eyebrow">TZ PODZ COLLECTION</div><h1>Escolha seu <em>PODZ.</em></h1><p>Demonstração visual de perfis aromáticos. Conteúdo ilustrativo, sem finalidade comercial.</p></section>
<main><input class="search" id="search" placeholder="Buscar produto..." aria-label="Buscar produto"><div class="grid" id="grid"></div></main>
<div class="modal" id="modal"><div class="dialog"><button class="close" id="close">✕</button><div class="modal-photo" id="modalPhoto"></div><h2 id="modalName"></h2><p id="modalDescription" style="color:#aaa;line-height:1.6"></p><div class="price" id="modalPrice"></div><a class="order" id="order" target="_blank" rel="noopener noreferrer">Consultar pelo WhatsApp</a></div></div>
<footer>© 2026 TZ PODZ • DEMONSTRAÇÃO INFORMATIVA</footer>
<script>
const whatsapp="";
const products=[{"id":1,"name":"Ignite — Perfil Menta","price":null,"image":"","description":"Perfil aromático ilustrativo de menta. Não representa confirmação de variante oficial da marca."},{"id":2,"name":"Ignite — Perfil Melancia","price":null,"image":"","description":"Perfil aromático ilustrativo de melancia. Não representa confirmação de variante oficial da marca."},{"id":3,"name":"Ignite — Perfil Uva","price":null,"image":"","description":"Perfil aromático ilustrativo de uva. Não representa confirmação de variante oficial da marca."},{"id":4,"name":"Ignite — Perfil Morango","price":null,"image":"","description":"Perfil aromático ilustrativo de morango. Não representa confirmação de variante oficial da marca."},{"id":5,"name":"Ignite — Perfil Manga","price":null,"image":"","description":"Perfil aromático ilustrativo de manga. Não representa confirmação de variante oficial da marca."},{"id":6,"name":"Ignite — Perfil Frutas Vermelhas","price":null,"image":"","description":"Perfil aromático ilustrativo de frutas vermelhas. Não representa confirmação de variante oficial da marca."},{"id":7,"name":"Ignite — Perfil Maçã Verde","price":null,"image":"","description":"Perfil aromático ilustrativo de maçã verde. Não representa confirmação de variante oficial da marca."},{"id":8,"name":"Ignite — Perfil Abacaxi","price":null,"image":"","description":"Perfil aromático ilustrativo de abacaxi. Não representa confirmação de variante oficial da marca."},{"id":9,"name":"Ignite — Perfil Maracujá","price":null,"image":"","description":"Perfil aromático ilustrativo de maracujá. Não representa confirmação de variante oficial da marca."},{"id":10,"name":"Ignite — Perfil Pêssego","price":null,"image":"","description":"Perfil aromático ilustrativo de pêssego. Não representa confirmação de variante oficial da marca."},{"id":11,"name":"Ignite — Perfil Limão","price":null,"image":"","description":"Perfil aromático ilustrativo de limão. Não representa confirmação de variante oficial da marca."},{"id":12,"name":"Ignite — Perfil Coco","price":null,"image":"","description":"Perfil aromático ilustrativo de coco. Não representa confirmação de variante oficial da marca."},{"id":13,"name":"Ignite — Perfil Banana","price":null,"image":"","description":"Perfil aromático ilustrativo de banana. Não representa confirmação de variante oficial da marca."},{"id":14,"name":"Ignite — Perfil Cereja","price":null,"image":"","description":"Perfil aromático ilustrativo de cereja. Não representa confirmação de variante oficial da marca."},{"id":15,"name":"Ignite — Perfil Blueberry","price":null,"image":"","description":"Perfil aromático ilustrativo de blueberry. Não representa confirmação de variante oficial da marca."},{"id":16,"name":"Ignite — Perfil Framboesa","price":null,"image":"","description":"Perfil aromático ilustrativo de framboesa. Não representa confirmação de variante oficial da marca."},{"id":17,"name":"Ignite — Perfil Lichia","price":null,"image":"","description":"Perfil aromático ilustrativo de lichia. Não representa confirmação de variante oficial da marca."},{"id":18,"name":"Ignite — Perfil Kiwi","price":null,"image":"","description":"Perfil aromático ilustrativo de kiwi. Não representa confirmação de variante oficial da marca."},{"id":19,"name":"Ignite — Perfil Melão","price":null,"image":"","description":"Perfil aromático ilustrativo de melão. Não representa confirmação de variante oficial da marca."},{"id":20,"name":"Ignite — Perfil Tangerina","price":null,"image":"","description":"Perfil aromático ilustrativo de tangerina. Não representa confirmação de variante oficial da marca."},{"id":21,"name":"Ignite — Perfil Goiaba","price":null,"image":"","description":"Perfil aromático ilustrativo de goiaba. Não representa confirmação de variante oficial da marca."},{"id":22,"name":"Ignite — Perfil Açaí","price":null,"image":"","description":"Perfil aromático ilustrativo de açaí. Não representa confirmação de variante oficial da marca."},{"id":23,"name":"Ignite — Perfil Pitaya","price":null,"image":"","description":"Perfil aromático ilustrativo de pitaya. Não representa confirmação de variante oficial da marca."},{"id":24,"name":"Ignite — Perfil Mix Tropical","price":null,"image":"","description":"Perfil aromático ilustrativo de mix tropical. Não representa confirmação de variante oficial da marca."}];
const money=n=>n===null?"Consulte o valor":n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const photo=p=>p.image?'<img src="'+p.image+'" alt="'+p.name+'">':'<div class="placeholder"><b>◇</b>FOTO EM BREVE</div>';
function render(){const q=document.getElementById("search").value.toLowerCase();const items=products.filter(p=>p.name.toLowerCase().includes(q));document.getElementById("grid").innerHTML=items.length?items.map(p=>'<article class="card"><div class="photo">'+photo(p)+'</div><div class="info"><h2>'+p.name+'</h2><p>'+p.description+'</p><div class="price '+(p.price===null?'unset':'')+'">'+money(p.price)+'</div><button class="details" data-id="'+p.id+'">VER DETALHES →</button></div></article>').join(""):'<p>Nenhum produto encontrado.</p>'}
function openModal(id){const p=products.find(x=>x.id===id);if(!p)return;document.getElementById("modalPhoto").innerHTML=photo(p);document.getElementById("modalName").textContent=p.name;document.getElementById("modalDescription").textContent=p.description;document.getElementById("modalPrice").textContent=money(p.price);const a=document.getElementById("order");a.href=whatsapp?'https://wa.me/'+whatsapp+'?text='+encodeURIComponent('Olá! Tenho interesse em '+p.name):'#';a.classList.toggle("disabled",!whatsapp);a.textContent=whatsapp?"Consultar pelo WhatsApp":"Contato em breve";document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("grid").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)openModal(Number(b.dataset.id))});
document.getElementById("close").addEventListener("click",closeModal);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.getElementById("search").addEventListener("input",render);render();
</script>
</body>
</html>
